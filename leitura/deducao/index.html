<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mesa de dedução · Laboratório de leitura</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      .bloco { border-radius: var(--radius); }
      .bloco.resolvido { border-color: var(--ok); }
      .bloco h3 { margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .frase { font-family: var(--serif); font-size: 18px; line-height: 2.1; margin: 14px 0; }
      .lacuna {
        font: 600 16px var(--sans);
        border: 0;
        border-bottom: 2px solid var(--accent);
        background: var(--sel);
        color: var(--text);
        padding: 2px 10px;
        margin: 0 2px;
        border-radius: 6px 6px 0 0;
        cursor: pointer;
        min-width: 70px;
      }
      .lacuna.vazia { background: var(--surface-2); color: var(--muted); }
      .resolvido .lacuna { background: color-mix(in srgb, var(--ok) 20%, transparent); border-color: var(--ok); cursor: default; }
      .apoio { font: 13px var(--sans); color: var(--muted); margin-top: -8px; }
      .estado-bloco { font-size: 14px; color: var(--muted); }
      .cartas { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
      .carta {
        font: inherit;
        color: var(--text);
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 12px;
        min-height: 92px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .carta b { font-size: 18px; }
      .carta.lida { background: var(--surface-2); }
      .termos { display: flex; flex-wrap: wrap; gap: 8px; }
      .termo { font: inherit; font-size: 15px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
      .termo.sel { border-color: var(--accent); background: var(--sel); }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="../shared/base.js"></script>
    <script src="app.js"></script>
  </body>
</html>
