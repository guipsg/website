<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Laboratório de leitura</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared/base.css" />
    <style>
      /* A lousa é sempre escura, como o ship log; janelas e leitor seguem o tema. */
      :root {
        --lousa: #0f1420;
        --lousa-grade: #18213a;
        --lousa-borda: #3d5ab8;
        --lousa-texto: #dfe6f3;
        --lousa-titulo: #86e39a;
        --lousa-laranja: #f0a040;
        --lousa-azul: #7fb4e8;
        --lousa-verde: #6cc2a8;
        --mono: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      }
      html, body.app { height: 100%; overflow: hidden; background: var(--lousa); overscroll-behavior: none; }
      .lousa { position: fixed; inset: 0; background: var(--lousa); }
      .lousa-svg { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
      .lousa-svg:active { cursor: grabbing; }
      .lousa-grade line { stroke: var(--lousa-grade); stroke-width: 1.5; }
      .moldura {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top, 0px));
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        left: max(8px, env(safe-area-inset-left, 0px));
        right: max(8px, env(safe-area-inset-right, 0px));
        border: 2px solid var(--lousa-borda);
        border-radius: 14px;
        box-shadow: inset 0 0 50px rgba(61, 90, 184, 0.18);
        pointer-events: none;
      }

      /* ---------- controles sobre a lousa ---------- */
      .hud-topo {
        position: fixed;
        top: calc(18px + env(safe-area-inset-top, 0px));
        left: max(18px, calc(env(safe-area-inset-left, 0px) + 10px));
        right: max(18px, calc(env(safe-area-inset-right, 0px) + 10px));
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }
      .hud-topo > * { pointer-events: auto; }
      .hud-titulo { flex: 1; min-width: 0; }
      .hud-titulo h1 { margin: 0; font: 400 24px var(--mono); color: var(--lousa-titulo); letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hud-titulo p { margin: 0; font: 13px var(--mono); color: #8b9ab8; }
      .hud-btn {
        font: 20px var(--sans);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1.5px solid #4a5f9c;
        background: rgba(15, 20, 32, 0.85);
        color: var(--lousa-texto);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .hud-btn:focus-visible { outline: 2px solid var(--lousa-titulo); }
      .hud-zoom {
        position: fixed;
        right: max(18px, calc(env(safe-area-inset-right, 0px) + 10px));
        bottom: calc(18px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .hud-info {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        width: min(420px, calc(100% - 120px));
        background: rgba(15, 20, 32, 0.92);
        border: 1.5px solid #4a5f9c;
        border-radius: 12px;
        padding: 12px 14px;
        color: var(--lousa-texto);
        font: 15px var(--mono);
      }
      .hud-info h2 { margin: 0 0 4px; font: 400 20px var(--mono); color: var(--lousa-titulo); }
      .hud-info p { margin: 2px 0 10px; color: #a9b6d0; }
      .hud-info .btn { font-family: var(--mono); }
      @media (max-width: 420px) { .hud-info { left: 18px; transform: none; width: calc(100% - 92px); } }

      /* ---------- sistema ---------- */
      .corpo { cursor: pointer; }
      .corpo:focus { outline: none; }
      .corpo:focus-visible .contorno, .corpo:focus-visible .anel { stroke: #fff; }
      .contorno { fill: none; stroke: #e6ebf5; stroke-width: 3; }
      .anel { fill: none; stroke: none; }
      .corpo.selecionado .anel { stroke: var(--lousa-titulo); stroke-width: 3; fill: none; stroke-dasharray: 10 8; }
      .nome-corpo { fill: var(--lousa-texto); font: 22px var(--mono); text-anchor: middle; }
      .lua-achada { fill: #c9d2e3; }

      /* ---------- constelação ---------- */
      .no { cursor: pointer; }
      .no:focus { outline: none; }
      .no:focus-visible circle, .no:focus-visible rect { stroke: #fff; }
      .no circle, .no rect { fill: #1a2234; stroke: #5d6b8c; stroke-width: 3; }
      .no.aberto circle { stroke: var(--lousa-laranja); }
      .no.resolvido circle { fill: #20324a; stroke: var(--lousa-azul); }
      .no.sintese circle { stroke-width: 5; }
      .no.palavra rect { fill: #1d2a26; stroke: var(--lousa-verde); }
      .no.palavra.completa rect { fill: #213a33; }
      .no .icone { fill: var(--lousa-laranja); font: 700 34px var(--sans); text-anchor: middle; dominant-baseline: central; }
      .no.resolvido .icone { fill: #cfe3f7; font-size: 26px; }
      .no.palavra .icone { fill: #bfeee0; font: 600 30px 'Times New Roman', serif; }
      .no .rotulo { fill: var(--lousa-texto); font: 20px var(--mono); text-anchor: middle; }
      .no.aberto .rotulo { fill: #f6c787; }
      .no.palavra .rotulo { fill: #9fe0cc; }
      .no .selo { fill: var(--lousa-laranja); stroke: var(--lousa); stroke-width: 3; }
      .no .selo-txt { fill: #1a1408; font: 700 16px var(--sans); text-anchor: middle; dominant-baseline: central; }
      .no.novo circle, .no.novo rect { animation: pulso 1.4s ease-in-out 3; }
      @keyframes pulso { 50% { stroke-width: 9; } }
      .aresta { stroke-width: 3; fill: none; }
      .aresta.pendente { stroke-dasharray: 10 8; }
      .e-tema { stroke: #8b9ab8; }
      .e-citacao { stroke: var(--lousa-laranja); }
      .e-alusao { stroke: #b48ce0; }
      .e-mesma_palavra { stroke: var(--lousa-verde); }
      .e-palavra { stroke: var(--lousa-verde); stroke-width: 2; opacity: 0.8; }

      /* ---------- janelas do jogo (seguem o tema) ---------- */
      .pistas-lista { padding-left: 18px; }
      .pistas-lista li { margin: 6px 0; }
      .prev { font-size: 14px; margin-top: 4px; }
      .prev.acertou { color: var(--ok); }
      .prev.errou { color: var(--warn); }
      .heb-grande { font: 60px 'Times New Roman', serif; text-align: center; direction: rtl; margin: 0; line-height: 1.1; }
      .translit { text-align: center; font-style: italic; color: var(--muted); margin: 0 0 8px; }
      .letras { display: flex; flex-direction: row-reverse; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
      .letra { font: inherit; width: 64px; padding: 8px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .letra .g { font: 32px 'Times New Roman', serif; line-height: 1.1; }
      .letra .n { font-size: 12px; color: var(--muted); }
      .letra.raiz { border-color: var(--accent); }
      .letra.sel { background: var(--sel); }
      .letra-info { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
      .letra-info .cur { font-size: 13px; color: var(--muted); }
      .raiz { border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; margin: 12px 0; }
      .raiz .heb { font: 24px 'Times New Roman', serif; }
      .raiz ul { padding-left: 18px; margin: 6px 0 0; }
      .achado-item { border-top: 1px solid var(--line); padding: 8px 0; font-size: 15px; }
      .achado-item b { background: var(--brilho-bg); border-radius: 4px; padding: 0 4px; }
      .achado-item .nota { font-size: 13px; color: var(--muted); }
      .faceta-linha { border-top: 1px solid var(--line); padding: 10px 0; display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
      .faceta-linha .desc { flex: 1; min-width: 0; font-size: 15px; }
      .faceta-linha.certa .desc { color: var(--ok); }

      /* síntese: arrastar palavras */
      .frase { font-family: var(--serif); font-size: 18px; line-height: 2.3; margin: 10px 0; }
      .vaga {
        display: inline-block;
        min-width: 96px;
        padding: 0 10px;
        margin: 0 3px;
        line-height: 1.7;
        text-align: center;
        border: 2px dashed var(--line);
        border-radius: 8px;
        font: 600 16px var(--sans);
        color: var(--muted);
        vertical-align: baseline;
        cursor: pointer;
      }
      .vaga.cheia { border-style: solid; border-color: var(--accent); color: var(--text); background: var(--sel); }
      .vaga.alvo { border-color: var(--accent); background: var(--hint); }
      .vaga.errada { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 18%, transparent); animation: tremor 0.4s; }
      .vaga.certa { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, transparent); cursor: default; }
      @keyframes tremor { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
      .bandeja { position: sticky; bottom: -18px; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface-2); min-height: 58px; margin-top: 10px; box-shadow: 0 -8px 16px var(--surface); }
      .ficha {
        font: 600 16px var(--sans);
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--accent);
        background: var(--surface);
        color: var(--text);
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .ficha.sel { background: var(--sel); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
      .ficha.fantasma { position: fixed; z-index: 90; pointer-events: none; transform: translate(-50%, -50%) scale(1.08); box-shadow: var(--shadow); }
      .entrada-diario { border-top: 1px solid var(--line); padding: 8px 0; font-size: 14px; }
    </style>
  </head>
  <body class="app">
    <div class="lousa" id="lousa"></div>
    <div class="moldura" aria-hidden="true"></div>
    <header class="hud-topo">
      <button class="hud-btn" id="voltar" aria-label="Voltar ao sistema" hidden>←</button>
      <div class="hud-titulo"><h1 id="titulo">Sistema</h1><p id="subtitulo">Arraste para mover · pinça para aproximar</p></div>
      <button class="hud-btn" id="menu" aria-label="Menu">☰</button>
    </header>
    <div class="hud-zoom">
      <button class="hud-btn" data-zoom="mais" aria-label="Aproximar">+</button>
      <button class="hud-btn" data-zoom="menos" aria-label="Afastar">−</button>
      <button class="hud-btn" data-zoom="enquadrar" aria-label="Enquadrar tudo">⤢</button>
    </div>
    <div class="hud-info" id="info" hidden></div>
    <script src="shared/base.js"></script>
    <script src="lousa.js"></script>
    <script src="app.js"></script>
  </body>
</html>
