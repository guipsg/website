<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Léxico vivo · Laboratório de leitura</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      .palavra-card { display: flex; align-items: center; gap: 14px; }
      .original { font-family: 'SBL Hebrew', 'Ezra SIL', 'Times New Roman', serif; font-size: 40px; direction: rtl; line-height: 1; }
      .original.grande { font-size: 64px; text-align: center; margin: 8px 0 0; }
      .translit { font-style: italic; text-align: center; color: var(--muted); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; }
      .chips span { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
      .barra { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
      .barra i { display: block; height: 100%; background: var(--accent); }
      .saber li { margin: 6px 0; }
      .saber .vazio { color: var(--muted); }
      .lote { margin: 18px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .ocor .estado { font-size: 13px; color: var(--muted); }
      .ocor.certa { border-color: var(--ok); }
      .ocor.errada { border-color: var(--warn); }
      .ocor .nota-sua { font-style: italic; color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="../shared/base.js"></script>
    <script src="app.js"></script>
  </body>
</html>
