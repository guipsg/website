<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Linha da promessa · Laboratório de leitura</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      .linha-tempo { position: relative; margin: 18px 0 0 10px; padding-left: 26px; border-left: 3px solid var(--line); }
      .epoca { position: relative; margin: 0 0 18px; }
      .epoca::before {
        content: '';
        position: absolute;
        left: -37px;
        top: 18px;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: var(--surface-2);
        border: 3px solid var(--line);
      }
      .epoca.feita::before { background: var(--accent); border-color: var(--accent); }
      .epoca.atual::before { background: var(--bg); border-color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 25%, transparent); }
      .epoca .card { margin: 0; }
      .epoca.atual .card { border-color: var(--accent); }
      .epoca h3 { margin: 0 0 2px; }
      .silhueta .card { background: transparent; border-style: dashed; color: var(--muted); font-style: italic; }
      .silhueta.oculta .card { text-align: center; font-style: normal; font-size: 22px; letter-spacing: 0.3em; }
      .prev { font-size: 14px; margin-top: 8px; }
      .prev.acertou { color: var(--ok); }
      .prev.errou { color: var(--warn); }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="../shared/base.js"></script>
    <script src="app.js"></script>
  </body>
</html>
